services:

  postgres-auth-db:
    image: postgres:17-alpine
    container_name: authbd-service-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: library
      POSTGRES_PASSWORD: library_dev
      POSTGRES_DB: auth_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_auth_bd:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U library -d auth_db" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - library-network

  postgres-library-db:
    image: postgres:17-alpine
    container_name: library-db-service-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: library_db
      POSTGRES_USER: library
      POSTGRES_PASSWORD: library_dev
    ports:
      - "5433:5432"
    volumes:
      - postgres_data_library_db:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U library -d library_db" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - library-network

  kafka:
    image: apache/kafka:4.1.0
    container_name: library-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

    volumes:
      - kafka_data:/var/lib/kafka/data

    networks:
      - library-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: library-kafka-ui
    restart: unless-stopped
    depends_on:
      - kafka
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: library-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    networks:
      - library-network

  zipkin:
    image: openzipkin/zipkin:3
    container_name: library-zipkin
    restart: unless-stopped
    ports:
      - "9411:9411"
    networks:
      - library-network

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: library-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - library-network

  grafana:
    image: grafana/grafana:12.2.0
    container_name: library-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - library-network

volumes:
  postgres_data_auth_bd:
  postgres_data_library_db:
  kafka_data:
  prometheus_data:
  grafana_data:

networks:
  library-network:
    driver: bridge